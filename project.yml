name: Vox
options:
  bundleIdPrefix: com.vox
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  defaultConfig: Debug
  xcodeVersion: "15.0"
  generateEmptyDirectories: true
settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_VERSION: "5.10"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_IDENTITY: "-"
    COMBINE_HIDPI_IMAGES: YES
packages:
  mlx-swift-lm:
    url: https://github.com/ml-explore/mlx-swift-examples
    exactVersion: 2.25.9
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit
    from: 1.0.0
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 2.2.0
targets:
  Vox:
    type: application
    platform: macOS
    sources:
      - path: Vox
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vox.app
        PRODUCT_NAME: Vox
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: Vox/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Vox/Vox.entitlements
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        SWIFT_EMIT_LOC_STRINGS: NO
    dependencies:
      - package: mlx-swift-lm
        product: MLXLLM
      - package: mlx-swift-lm
        product: MLXLMCommon
      - package: WhisperKit
        product: WhisperKit
      - package: KeyboardShortcuts
        product: KeyboardShortcuts
    info:
      path: Vox/Info.plist
      properties:
        LSUIElement: true
        NSMicrophoneUsageDescription: Vox records your voice while you hold the push-to-talk shortcut so it can transcribe your instruction.
        NSHighResolutionCapable: true
        NSPrincipalClass: NSApplication
        CFBundleDisplayName: Vox
schemes:
  Vox:
    build:
      targets:
        Vox: all
    run:
      config: Debug
    archive:
      config: Release
